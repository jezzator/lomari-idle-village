name: Android-app bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pakketten
        run: npm install
      - name: Web-app klaarzetten
        run: npm run web
      - name: Android-project maken
        run: npx cap add android && npx cap sync android
      - name: Icoon en startscherm
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1c1f16' --splashBackgroundColor '#1c1f16'
      - name: Alleen staand scherm
        run: sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Vaste sleutel en oplopend versienummer (zodat updates over de oude app heen installeren)
        run: |
          # De sleutel staat in signing/ en wordt rechtstreeks in Gradle ingesteld; ~/.android werd niet gebruikt.
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("..\/..\/signing\/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -n -A7 'signingConfigs' android/app/build.gradle
          grep -n 'versionCode\|versionName' android/app/build.gradle
      - name: APK bouwen
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Controleer de sleutel
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA256 | head -1
      - name: Naam geven
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lomari-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lomari-android
          path: Lomari-${{ github.run_number }}.apk
      - name: Uitgave met downloadlink
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Lomari ${{ github.run_number }}
          body: Open deze pagina op je Android-telefoon en tik op het .apk-bestand om te installeren.
          files: Lomari-${{ github.run_number }}.apk
          make_latest: true
